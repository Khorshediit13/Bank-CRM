<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #fafafa; }
        nav { background: #333; padding: 12px; border-radius: 5px; }
        nav a { color: white; margin-right: 20px; font-weight: bold; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        form { background: white; padding: 15px; border-radius: 5px; margin-top: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        form select, form input { padding: 8px; margin-right: 10px; margin-bottom: 10px; width: 180px; }
        form button { padding: 8px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn-delete { background-color: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
    </style>
	
	<script src="../assets/js/constants.js"></script>
</head>
<body>

    <nav>
        <a href="index.html">Dashboard</a>
        <a href="customers.html">Customer Management</a>
        <a href="accounts.html">Account Management</a>
    </nav>

    <h2>Account Management</h2>

    <form id="accountForm">
        <select id="accountCustomerId" required>
            <option value="">Select Customer</option>
        </select>
        <input type="text" id="accountNumber" placeholder="Account Number" required>
        <select id="accountType" required>
            <option value="Savings">Savings</option>
            <option value="Current">Current</option>
        </select>
        <input type="number" id="balance" placeholder="Initial Balance" step="0.01" required>
        <button type="submit">Create Account</button>
    </form>

    <h3>Account List</h3>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Account No</th>
                <th>Type</th>
                <th>Balance ($)</th>
                <th>Customer Name</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="accountTableBody"></tbody>
    </table>

    <script>
        const accountApi = 'http://localhost:8080/api/accounts';
        const customerApi = 'http://localhost:8080/api/customers';

        function loadCustomerDropdown() {
            fetch(customerApi)
                .then(res => res.json())
                .then(customers => {
                    let options = '<option value="">Select Customer</option>';
                    customers.forEach(c => {
                        options += `<option value="${c.id}">${c.name} (ID: ${c.id})</option>`;
                    });
                    document.getElementById('accountCustomerId').innerHTML = options;
                });
        }

        function loadAccounts() {
            fetch(accountApi)
                .then(res => res.json())
                .then(data => {
                    let rows = '';
                    data.forEach(a => {
                        rows += `<tr>
                            <td>${a.id}</td>
                            <td>${a.accountNumber}</td>
                            <td>${a.accountType}</td>
                            <td>${a.balance}</td>
                            <td>${a.customer ? a.customer.name : 'N/A'}</td>
                            <td><button class="btn-delete" onclick="deleteAccount(${a.id})">Delete</button></td>
                        </tr>`;
                    });
                    document.getElementById('accountTableBody').innerHTML = rows;
                });
        }

        document.getElementById('accountForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const customerId = document.getElementById('accountCustomerId').value;
            const account = {
                accountNumber: document.getElementById('accountNumber').value,
                accountType: document.getElementById('accountType').value,
                balance: parseFloat(document.getElementById('balance').value)
            };

            fetch(`${accountApi}/customer/${customerId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(account)
            }).then(() => {
                this.reset();
                loadAccounts();
            });
        });

        function deleteAccount(id) {
            if(confirm("Are you sure you want to delete this account?")) {
                fetch(`${accountApi}/${id}`, { method: 'DELETE' })
                    .then(() => loadAccounts());
            }
        }

        loadCustomerDropdown();
        loadAccounts();
    </script>
</body>
</html>
