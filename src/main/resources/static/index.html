<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bank CRM - Management Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 20px; }
        .container { max-width: 900px; background: white; padding: 25px; border-radius: 8px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 8px; margin-top: 20px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #2ecc71; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-delete { background: #e74c3c; padding: 5px 10px; font-size: 12px; }
        table { width: 100%; margin-top: 15px; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #3498db; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>Add New Customer</h2>
    <form id="customerForm">
        <div class="form-group"><label>Name:</label><input type="text" id="name" required></div>
        <div class="form-group"><label>Email:</label><input type="email" id="email" required></div>
        <div class="form-group"><label>Phone:</label><input type="text" id="phone" required></div>
        <div class="form-group"><label>Address:</label><input type="text" id="address" required></div>
        <button type="submit">Save Customer 21221</button>
    </form>

    <h2>Customer List</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Address</th><th>Action</th>
            </tr>
        </thead>
        <tbody id="customerTableBody"></tbody>
    </table>
</div>

<script>
    const apiUrl = 'http://localhost:8080/api/customers';

    function loadCustomers() {
        fetch(apiUrl)
            .then(res => res.json())
            .then(data => {
                let rows = '';
                data.forEach(c => {
                    rows += `<tr>
                        <td>${c.id}</td>
                        <td>${c.name}</td>
                        <td>${c.email}</td>
                        <td>${c.phone}</td>
                        <td>${c.address}</td>
                        <td><button class="btn-delete" onclick="deleteCustomer(${c.id})">Delete</button></td>
                    </tr>`;
                });
                document.getElementById('customerTableBody').innerHTML = rows;
            });
    }

    document.getElementById('customerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const customer = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value
        };

        fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(customer)
        }).then(() => {
            this.reset();
            loadCustomers();
        });
    });

    function deleteCustomer(id) {
        fetch(`${apiUrl}/${id}`, { method: 'DELETE' })
            .then(() => loadCustomers());
    }

    loadCustomers();
</script>

</body>
</html>
