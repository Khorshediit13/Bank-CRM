<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #fafafa; }
        nav { background: #333; padding: 12px; border-radius: 5px; }
        nav a { color: white; margin-right: 20px; font-weight: bold; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        form { background: white; padding: 15px; border-radius: 5px; margin-top: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        form input { padding: 8px; margin-right: 10px; margin-bottom: 10px; width: 200px; }
        form button { padding: 8px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn-delete { background-color: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
    </style>
	<script src="../assets/js/constants.js"></script>
</head>
<body>

    <nav>
        <a href="index.html">Dashboard</a>
        <a href="customers.html">Customer Management</a>
        <a href="accounts.html">Account Management</a>
    </nav>

    <h2>Customer Management</h2>

    <form id="customerForm">
        <input type="text" id="name" placeholder="Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="text" id="phone" placeholder="Phone" required>
        <input type="text" id="address" placeholder="Address" required>
        <button type="submit">Add Customer</button>
    </form>

    <h3>Customer List</h3>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="customerTableBody"></tbody>
    </table>

    <script>
        const customerApi = baseApi + /customers';

        function loadCustomers() {
            fetch(customerApi)
                .then(res => res.json())
                .then(data => {
                    let rows = '';
                    data.forEach(c => {
                        rows += `<tr>
                            <td>${c.id}</td>
                            <td>${c.name}</td>
                            <td>${c.email}</td>
                            <td>${c.phone}</td>
                            <td>${c.address}</td>
                            <td><button class="btn-delete" onclick="deleteCustomer(${c.id})">Delete</button></td>
                        </tr>`;
                    });
                    document.getElementById('customerTableBody').innerHTML = rows;
                });
        }

        document.getElementById('customerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const customer = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value
            };

            fetch(customerApi, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(customer)
            }).then(() => {
                this.reset();
                loadCustomers();
            });
        });

        function deleteCustomer(id) {
            if(confirm("Are you sure you want to delete this customer?")) {
                fetch(`${customerApi}/${id}`, { method: 'DELETE' })
                    .then(() => loadCustomers());
            }
        }

        loadCustomers();
    </script>
</body>
</html>
